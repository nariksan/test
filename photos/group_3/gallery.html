<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фотоальбом — Группа №3 ⭐</title>
<style>
:root {
  --brand-green: #2d8b4d;
  --brand-orange: #e87722;
  --radius: 16px;
  --shadow: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 20px;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 20% 50%, rgba(255,107,107,0.3) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(78,205,196,0.3) 0%, transparent 50%),
    radial-gradient(circle at 40% 20%, rgba(255,217,61,0.3) 0%, transparent 50%);
  animation: backgroundMove 20s ease infinite;
  z-index: -1;
}
@keyframes backgroundMove {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-20px, -20px); }
}

.container { max-width: 1400px; margin: 0 auto; }

.header {
  text-align: center;
  background: rgba(255,255,255,0.95);
  padding: 40px 20px;
  border-radius: var(--radius);
  margin-bottom: 40px;
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(10px);
  animation: slideDown 0.8s ease;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}
.header h1 { 
  font-size: 3em; 
  margin-bottom: 10px;
  background: linear-gradient(135deg, var(--brand-green), var(--brand-orange));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header p { font-size: 1.3em; color: #666; }

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  padding: 10px;
}

.photo-card {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  cursor: pointer;
  background: white;
  animation: fadeInUp 0.6s ease backwards;
}
.photo-card:nth-child(1) { animation-delay: 0.1s; }
.photo-card:nth-child(2) { animation-delay: 0.15s; }
.photo-card:nth-child(3) { animation-delay: 0.2s; }
.photo-card:nth-child(4) { animation-delay: 0.25s; }
.photo-card:nth-child(5) { animation-delay: 0.3s; }
.photo-card:nth-child(6) { animation-delay: 0.35s; }
.photo-card:nth-child(7) { animation-delay: 0.4s; }
.photo-card:nth-child(8) { animation-delay: 0.45s; }
.photo-card:nth-child(9) { animation-delay: 0.5s; }
.photo-card:nth-child(10) { animation-delay: 0.55s; }
.photo-card:nth-child(11) { animation-delay: 0.6s; }
.photo-card:nth-child(12) { animation-delay: 0.65s; }
.photo-card:nth-child(13) { animation-delay: 0.7s; }
.photo-card:nth-child(14) { animation-delay: 0.75s; }
.photo-card:nth-child(15) { animation-delay: 0.8s; }
.photo-card:nth-child(16) { animation-delay: 0.85s; }
.photo-card:nth-child(17) { animation-delay: 0.9s; }
.photo-card:nth-child(18) { animation-delay: 0.95s; }
.photo-card:nth-child(19) { animation-delay: 1s; }
.photo-card:nth-child(20) { animation-delay: 1.05s; }
.photo-card:nth-child(21) { animation-delay: 1.1s; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.photo-card:hover {
  transform: translateY(-10px) scale(1.03) rotate(1deg);
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  z-index: 10;
}

.photo-card img {
  width: 100%;
  height: 280px;
  object-fit: cover;
  display: block;
  transition: all 0.4s;
}

.photo-card:hover img {
  transform: scale(1.1);
  filter: brightness(1.1) contrast(1.1);
}

.photo-card::after {
  content: '🔍';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 3em;
  background: rgba(255,255,255,0.9);
  width: 80px;
  height: 80px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  opacity: 0;
}

.photo-card:hover::after {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.photo-card.large { grid-column: span 2; grid-row: span 2; }
.photo-card.large img { height: 100%; min-height: 580px; }
.photo-card.medium { grid-column: span 2; }
.photo-card.medium img { height: 350px; }

.photo-card:nth-child(3n+1) { border: 3px solid #ff6b6b; }
.photo-card:nth-child(3n+2) { border: 3px solid #4ecdc4; }
.photo-card:nth-child(3n+3) { border: 3px solid #ffd93d; }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 20px;
  cursor: pointer;
  animation: fadeIn 0.3s;
}
.modal-overlay.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-overlay img {
  max-width: 95%;
  max-height: 90vh;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes zoomIn {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal-close {
  position: fixed;
  top: 20px;
  right: 30px;
  color: white;
  font-size: 2.5em;
  cursor: pointer;
  z-index: 1001;
  background: rgba(255,255,255,0.2);
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}
.modal-close:hover {
  background: rgba(255,255,255,0.3);
  transform: rotate(90deg) scale(1.1);
}

.modal-nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-size: 3em;
  cursor: pointer;
  z-index: 1001;
  background: rgba(255,255,255,0.2);
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  user-select: none;
}
.modal-nav:hover {
  background: rgba(255,255,255,0.3);
  transform: translateY(-50%) scale(1.1);
}
.modal-prev { left: 20px; }
.modal-next { right: 20px; }

.photo-counter {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: linear-gradient(135deg, var(--brand-green), var(--brand-orange));
  color: white;
  padding: 15px 25px;
  border-radius: 30px;
  font-weight: 700;
  font-size: 1.1em;
  box-shadow: var(--shadow-lg);
  z-index: 100;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.decoration {
  position: fixed;
  font-size: 2em;
  opacity: 0.3;
  animation: float 6s ease-in-out infinite;
  pointer-events: none;
  z-index: -1;
}
.decoration:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
.decoration:nth-child(2) { top: 20%; right: 10%; animation-delay: 1s; }
.decoration:nth-child(3) { bottom: 30%; left: 8%; animation-delay: 2s; }
.decoration:nth-child(4) { bottom: 10%; right: 5%; animation-delay: 3s; }
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-20px) rotate(10deg); }
}

@media (max-width: 768px) {
  .header h1 { font-size: 2em; }
  .header p { font-size: 1em; }
  .gallery { grid-template-columns: 1fr; gap: 15px; }
  .photo-card.large, .photo-card.medium { grid-column: span 1; }
  .photo-card.large img { min-height: 280px; }
  .photo-card.medium img { height: 280px; }
  .photo-counter { bottom: 15px; right: 15px; font-size: 0.9em; padding: 10px 15px; }
  .modal-nav { width: 50px; height: 50px; font-size: 2em; }
}

@media (min-width: 1200px) {
  .gallery { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>

<div class="decoration"></div>
<div class="decoration"></div>
<div class="decoration">🎭</div>
<div class="decoration">🎪</div>

<div class="container">

<div class="header">

  <p>✨ Наши яркие моменты и праздники ✨</p>
</div>

<div class="gallery">

  <div class="photo-card large" onclick="openModal(0)">

<!-- Модальное окно -->
<div class="modal-overlay" id="photoModal" onclick="closeModal(event)">
  <div class="modal-close" onclick="closeModal(event)">✕</div>
  <div class="modal-nav modal-prev" onclick="changePhoto(-1, event)">‹</div>
  <img id="modalImage" src="" alt="Фото">
  <div class="modal-nav modal-next" onclick="changePhoto(1, event)">›</div>
</div>

<!-- Счётчик -->
<div class="photo-counter">📸 <span id="photoCount">21</span> фото</div>

<script>
const photos = [
  '1.jfif', '2.jfif', '3.jfif', '4.jfif', '5.jfif',
  '6.jfif', '7.jfif', '8.jfif', '9.jfif', '10.jfif',
  '11.jfif', '12.jfif', '13.jfif', '14.jfif', '15.jfif',
  '16.jfif', '17.jfif', '18.jfif', '19.jfif', '20.jfif', '21.jfif'
];

let currentPhotoIndex = 0;

function openModal(index) {
  currentPhotoIndex = index;
  document.getElementById('modalImage').src = photos[index];
  document.getElementById('photoModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal(event) {
  if (event.target.id === 'photoModal' || event.target.classList.contains('modal-close')) {
    document.getElementById('photoModal').classList.remove('active');
    document.body.style.overflow = '';
  }
}

function changePhoto(direction, event) {
  event.stopPropagation();
  currentPhotoIndex += direction;
  if (currentPhotoIndex < 0) currentPhotoIndex = photos.length - 1;
  if (currentPhotoIndex >= photos.length) currentPhotoIndex = 0;
  document.getElementById('modalImage').src = photos[currentPhotoIndex];
}

document.addEventListener('keydown', function(e) {
  if (document.getElementById('photoModal').classList.contains('active')) {
    if (e.key === 'Escape') closeModal({ target: { id: 'photoModal' } });
    if (e.key === 'ArrowLeft') changePhoto(-1, { stopPropagation: () => {} });
    if (e.key === 'ArrowRight') changePhoto(1, { stopPropagation: () => {} });
  }
});

let touchStartX = 0;
let touchEndX = 0;

document.getElementById('photoModal').addEventListener('touchstart', function(e) {
  touchStartX = e.changedTouches[0].screenX;
});

document.getElementById('photoModal').addEventListener('touchend', function(e) {
  touchEndX = e.changedTouches[0].screenX;
  if (touchStartX - touchEndX > 50) changePhoto(1, { stopPropagation: () => {} });
  if (touchEndX - touchStartX > 50) changePhoto(-1, { stopPropagation: () => {} });
});
</script>

</body>
</html>
