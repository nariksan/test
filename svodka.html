<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d8b4d">
<title>Сводка группы</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
:root { --success:#28a745; --danger:#dc3545; --warning:#fd7e14; --info:#17a2b8; --brand-green:#2d8b4d; --brand-orange:#e87722; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f5f7fa; color:#333; line-height:1.6; padding:20px; }
.container { max-width:900px; margin:0 auto; background:white; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,0.1); overflow:hidden; }
.header { background:linear-gradient(135deg,#2d8b4d 0%,#e87722 100%); color:white; padding:40px 30px; text-align:center; }
.header-icon { font-size:3em; margin-bottom:10px; }
.header h1 { font-size:1.8em; margin-bottom:8px; font-weight:800; }
.header h2 { font-size:1.2em; opacity:0.95; font-weight:600; }
.header .subtitle { font-size:0.9em; opacity:0.85; margin-top:8px; }
.content { padding:30px; }
.section { margin-bottom:30px; }
.section-title { font-size:1.3em; font-weight:700; color:#2d8b4d; margin-bottom:16px; padding-bottom:10px; border-bottom:3px solid #e87722; display:flex; align-items:center; gap:10px; }
.section-title.plans { color:#e87722; border-bottom-color:#2d8b4d; }
.section-icon { font-size:1.2em; }
.summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
.summary-card { background:linear-gradient(135deg,#f8f9fa 0%,#e9ecef 100%); padding:16px; border-radius:12px; text-align:center; border-left:4px solid #2d8b4d; }
.summary-card.green { border-left-color:#28a745; }
.summary-card.red { border-left-color:#dc3545; }
.summary-card.orange { border-left-color:#fd7e14; }
.summary-card.blue { border-left-color:#17a2b8; }
.summary-label { font-size:0.75em; text-transform:uppercase; color:#666; margin-bottom:6px; font-weight:600; }
.summary-value { font-size:1.5em; font-weight:800; color:#333; }
.summary-value.positive { color:#28a745; }
.summary-value.negative { color:#dc3545; }
table { width:100%; border-collapse:collapse; margin-top:15px; background:white; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
th { background:#2d8b4d; color:white; padding:10px; text-align:left; font-size:0.82em; text-transform:uppercase; font-weight:700; }
td { padding:10px; border-top:1px solid #e9ecef; font-size:0.9em; }
tr:hover { background:#f8f9fa; }
.status-paid { color:#28a745; font-weight:700; font-size:0.88em; }
.status-unpaid { color:#fd7e14; font-weight:700; font-size:0.88em; }
.amount { font-weight:600; text-align:right; }
.totals-row { background:#fff9e6 !important; font-weight:700; border-top:2px solid #e87722; }
.expense-amount { color:#dc3545; }
.comment-box { background:#fffbeb; border-left:4px solid #fd7e14; padding:15px 20px; border-radius:8px; margin-bottom:20px; font-style:italic; color:#5b4300; }
.footer { background:#f8f9fa; padding:20px 30px; text-align:center; color:#666; font-size:0.85em; border-top:2px solid #e9ecef; }
.footer strong { color:#2d8b4d; }
.login-btn { display:inline-block; margin-top:10px; padding:10px 20px; background:#2d8b4d; color:white; text-decoration:none; border-radius:8px; font-weight:600; }
.login-btn:hover { background:#236b3a; }
.paid-list { background:#f0fdf4; padding:15px; border-radius:8px; border-left:4px solid #28a745; }
.unpaid-list { background:#fffbeb; padding:15px; border-radius:8px; border-left:4px solid #fd7e14; }
.list-item { padding:6px 0; border-bottom:1px solid #e9ecef; }
.list-item:last-child { border-bottom:none; }
.error-box { text-align:center; padding:60px 20px; color:var(--danger); }
.error-icon { font-size:4em; margin-bottom:16px; }
.password-modal { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:10000; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px); }
.password-box { background:white; border-radius:16px; padding:30px; max-width:400px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
.password-box h2 { color:#2d8b4d; margin-bottom:16px; text-align:center; }
.password-box input { width:100%; padding:12px; border:2px solid #e9ecef; border-radius:8px; font-size:1em; margin-bottom:12px; }
.password-box input:focus { outline:none; border-color:#2d8b4d; }
.password-box button { width:100%; padding:12px; background:#2d8b4d; color:white; border:none; border-radius:8px; font-size:1em; font-weight:700; cursor:pointer; }
.password-box button:hover { background:#236b3a; }
.password-error { color:#dc3545; font-size:0.9em; margin-top:8px; text-align:center; display:none; }
.loading { text-align:center; padding:60px; color:#999; }
.loading-spinner { display:inline-block; width:40px; height:40px; border:4px solid #e9ecef; border-top-color:#2d8b4d; border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.progress-bar { background:#e9ecef; border-radius:10px; height:24px; overflow:hidden; margin:10px 0; }
.progress-fill { background:linear-gradient(90deg,#28a745,#2d8b4d); height:100%; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:0.85em; transition:width 0.5s; }
.plans-info { background:#fff3cd; border-left:4px solid #fd7e14; padding:15px 20px; border-radius:8px; margin-bottom:20px; color:#856404; }
.plans-info strong { color:#5b4300; }
@media (max-width:600px) { .header { padding:25px 20px; } .header h1 { font-size:1.4em; } .content { padding:20px; } .summary-grid { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<div id="app">
<div class="loading"><div class="loading-spinner"></div><p style="margin-top:16px">Загрузка сводки...</p></div>
</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyDKi0CkhA5jPr7fNkPerItkLDKNLMcLpMw",
authDomain: "parent-budget-70c5a.firebaseapp.com",
projectId: "parent-budget-70c5a",
storageBucket: "parent-budget-70c5a.firebasestorage.app",
messagingSenderId: "214835144455",
appId: "1:214835144455:web:b1d91914f16c66004507a2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let reportData = null;
let passwordVerified = false;

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatMoney(n) { return Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 }); }
function calcIncome(m) { return m.students.reduce((s, x) => s + (x.paid ? Number(x.amount || 0) : 0), 0); }
function calcExpense(m) { return m.expenses.reduce((s, x) => s + Number(x.amount || 0), 0); }

function getQueryParam(name) {
const params = new URLSearchParams(window.location.search);
return params.get(name);
}

async function loadReport(token) {
try {
const doc = await db.collection('public_reports').doc(token).get();
if (!doc.exists) {
showError('Ссылка недействительна', 'Эта сводка не найдена или была удалена.');
return false;
}
reportData = { id: doc.id, ...doc.data() };
if (!reportData.active) {
showError('Ссылка отозвана', 'Эта сводка больше не доступна. Обратитесь к администратору группы.');
return false;
}
return true;
} catch(e) {
showError('Ошибка загрузки', 'Не удалось загрузить сводку: ' + e.message);
return false;
}
}

function showError(title, text) {
document.getElementById('app').innerHTML = '<div class="container"><div class="error-box"><div class="error-icon"></div><h2 style="color:#dc3545;margin-bottom:10px">' + escapeHtml(title) + '</h2><p style="color:#666">' + escapeHtml(text) + '</p><a href="index.html" class="login-btn" style="margin-top:20px">🏠 На главную</a></div></div>';
}

function showPasswordModal() {
document.getElementById('app').innerHTML = '<div class="password-modal"><div class="password-box"><h2> Введите пароль</h2><p style="text-align:center;color:#666;margin-bottom:16px;font-size:0.9em">Для просмотра сводки нужен пароль</p><input type="password" id="pwdInput" placeholder="Пароль" onkeypress="if(event.key===\'Enter\')checkPassword()"><button onclick="checkPassword()"> Войти</button><div class="password-error" id="pwdError">Неверный пароль</div><p style="text-align:center;margin-top:16px;font-size:0.8em;color:#999">Пароль должен быть в сообщении от администратора группы</p></div></div>';
document.getElementById('pwdInput').focus();
}

async function checkPassword() {
const input = document.getElementById('pwdInput').value;
if (input === reportData.password) {
passwordVerified = true;
renderReport();
} else {
document.getElementById('pwdError').style.display = 'block';
document.getElementById('pwdInput').value = '';
}
}

function renderReport() {
const g = reportData.groupInfo || {};
const archiveM = reportData.archiveMonth;
const currentM = reportData.currentMonth;
const generatedDate = new Date().toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });

let html = '<div class="container">';
html += '<div class="header"><div class="header-icon">💰</div>';
html += '<h1>' + escapeHtml(reportData.title || 'Финансовая сводка') + '</h1>';
html += '<h2>Группа №' + escapeHtml(g.number || '') + ' «' + escapeHtml(g.name || '') + '»</h2>';
if (reportData.archiveMonthName || reportData.currentMonthName) {
html += '<div class="subtitle">' + escapeHtml(reportData.archiveMonthName || '') + (reportData.archiveMonthName && reportData.currentMonthName ? ' → ' : '') + escapeHtml(reportData.currentMonthName || '') + '</div>';
}
html += '</div><div class="content">';

if (reportData.comment) {
html += '<div class="comment-box">💬 ' + escapeHtml(reportData.comment) + '</div>';
}

// === АРХИВНЫЙ МЕСЯЦ (ИТОГИ) ===
if (archiveM) {
const aInc = calcIncome(archiveM);
const aAi = Number(archiveM.additionalIncome || 0);
const aExp = calcExpense(archiveM);
const aPrev = Number(archiveM.prevBalance || 0);
const aBal = aPrev + aInc + aAi - aExp;
const aPc = archiveM.students.filter(s => s.paid).length;
const aTc = archiveM.students.filter(s => s.name).length;

html += '<div class="section"><div class="section-title"><span class="section-icon">📊</span>Итоги: ' + escapeHtml(archiveM.name) + '</div>';
html += '<div class="summary-grid">';
html += '<div class="summary-card blue"><div class="summary-label">Остаток с прошл. мес.</div><div class="summary-value">' + formatMoney(aPrev) + ' ₽</div></div>';
html += '<div class="summary-card green"><div class="summary-label">Приход (взносы)</div><div class="summary-value positive">' + formatMoney(aInc) + ' ₽</div></div>';
html += '<div class="summary-card orange"><div class="summary-label">Доп. приход</div><div class="summary-value">' + formatMoney(aAi) + ' ₽</div></div>';
html += '<div class="summary-card red"><div class="summary-label">Расход</div><div class="summary-value negative">' + formatMoney(aExp) + ' ₽</div></div>';
html += '<div class="summary-card green"><div class="summary-label">Итоговый остаток</div><div class="summary-value positive">' + formatMoney(aBal) + ' ₽</div></div>';
html += '</div>';

if (aTc > 0) {
html += '<table><thead><tr><th style="width:40px">№</th><th>ФИО ребёнка</th><th style="width:110px">Сумма</th><th style="width:110px;text-align:center">Статус</th></tr></thead><tbody>';
archiveM.students.filter(s => s.name).forEach((s, i) => {
html += '<tr><td>' + (i+1) + '</td><td>' + escapeHtml(s.name) + '</td><td class="amount">' + (s.amount ? formatMoney(s.amount) + ' ₽' : '—') + '</td><td style="text-align:center" class="' + (s.paid ? 'status-paid' : 'status-unpaid') + '">' + (s.paid ? '✔ Оплачено' : '⏳ Ожидается') + '</td></tr>';
});
html += '<tr class="totals-row"><td colspan="2"><strong>ИТОГО:</strong> сдали ' + aPc + ' из ' + aTc + '</td><td class="amount"><strong>' + formatMoney(aInc) + ' ₽</strong></td><td></td></tr>';
html += '</tbody></table>';
}

if (archiveM.expenses.length > 0) {
html += '<div style="margin-top:20px"><h3 style="color:#2d8b4d;margin-bottom:10px;font-size:1.05em">💸 Расходы</h3><table><thead><tr><th style="width:40px">№</th><th>На что потрачено</th><th style="width:120px;text-align:right">Сумма</th></tr></thead><tbody>';
archiveM.expenses.forEach((e, i) => {
html += '<tr><td>' + (i+1) + '</td><td>' + escapeHtml(e.description || '—') + '</td><td class="amount expense-amount">- ' + (e.amount ? formatMoney(e.amount) + ' ₽' : '—') + '</td></tr>';
});
html += '<tr class="totals-row"><td colspan="2"><strong>ИТОГО РАСХОД:</strong></td><td class="amount expense-amount"><strong>' + formatMoney(aExp) + ' ₽</strong></td></tr>';
html += '</tbody></table></div>';
}
html += '</div>';
}

// === ТЕКУЩИЙ МЕСЯЦ (ПЛАНЫ) ===
if (currentM) {
const cInc = calcIncome(currentM);
const cAi = Number(currentM.additionalIncome || 0);
const cExp = calcExpense(currentM);
const cPrev = Number(currentM.prevBalance || 0);
const cBal = cPrev + cInc + cAi - cExp;
const cPc = currentM.students.filter(s => s.paid).length;
const cTc = currentM.students.filter(s => s.name).length;
const totalExpected = currentM.students.reduce((s, x) => s + (x.name ? Number(x.amount || 0) : 0), 0);
const remaining = totalExpected - cInc;
const progressPercent = totalExpected > 0 ? Math.round((cInc / totalExpected) * 100) : 0;

html += '<div class="section"><div class="section-title plans"><span class="section-icon">📋</span>Планы на ' + escapeHtml(currentM.name) + '</div>';

html += '<div class="plans-info"><strong>💡 Уважаемые родители!</strong> Ниже представлена информация о планируемом сборе взносов на текущий месяц. Мы собираем средства на нужды группы. Пожалуйста, ознакомьтесь с планами расходов и статусом сбора.</div>';

// На что планируется потратить
if (currentM.expenses.length > 0) {
html += '<h3 style="color:#e87722;margin-bottom:10px;font-size:1.1em">🎯 На что планируется потратить</h3>';
html += '<table><thead><tr><th style="width:40px">№</th><th>Статья расходов</th><th style="width:120px;text-align:right">Сумма</th></tr></thead><tbody>';
currentM.expenses.forEach((e, i) => {
html += '<tr><td>' + (i+1) + '</td><td>' + escapeHtml(e.description || '—') + '</td><td class="amount expense-amount">' + (e.amount ? formatMoney(e.amount) + ' ₽' : '—') + '</td></tr>';
});
html += '<tr class="totals-row"><td colspan="2"><strong>ИТОГО ЗАПЛАНИРОВАНО:</strong></td><td class="amount expense-amount"><strong>' + formatMoney(cExp) + ' ₽</strong></td></tr>';
html += '</tbody></table>';
} else {
html += '<div class="plans-info">📝 Планы расходов на текущий месяц ещё не сформированы. Информация будет обновлена.</div>';
}

// Прогресс сбора
html += '<h3 style="color:#2d8b4d;margin:20px 0 10px;font-size:1.1em">📊 Прогресс сбора взносов</h3>';
html += '<div class="summary-grid">';
html += '<div class="summary-card blue"><div class="summary-label">Остаток с прошл. мес.</div><div class="summary-value">' + formatMoney(cPrev) + ' ₽</div></div>';
html += '<div class="summary-card green"><div class="summary-label">Уже собрано</div><div class="summary-value positive">' + formatMoney(cInc) + ' ₽</div></div>';
html += '<div class="summary-card orange"><div class="summary-label">Осталось собрать</div><div class="summary-value">' + formatMoney(Math.max(0, remaining)) + ' ₽</div></div>';
html += '<div class="summary-card green"><div class="summary-label">Текущий баланс</div><div class="summary-value positive">' + formatMoney(cBal) + ' ₽</div></div>';
html += '</div>';

if (totalExpected > 0) {
html += '<div class="progress-bar"><div class="progress-fill" style="width:' + progressPercent + '%">' + progressPercent + '%</div></div>';
html += '<p style="text-align:center;color:#666;font-size:0.9em">Собрано ' + cPc + ' из ' + cTc + ' родителей</p>';
}

// Кто сколько должен
if (cTc > 0) {
html += '<h3 style="color:#2d8b4d;margin:20px 0 10px;font-size:1.1em">👥 Сбор взносов по родителям</h3>';
html += '<table><thead><tr><th style="width:40px">№</th><th>ФИО ребёнка</th><th style="width:110px">Сумма</th><th style="width:110px;text-align:center">Статус</th></tr></thead><tbody>';
currentM.students.filter(s => s.name).forEach((s, i) => {
html += '<tr><td>' + (i+1) + '</td><td>' + escapeHtml(s.name) + '</td><td class="amount">' + (s.amount ? formatMoney(s.amount) + ' ₽' : '—') + '</td><td style="text-align:center" class="' + (s.paid ? 'status-paid' : 'status-unpaid') + '">' + (s.paid ? '✔ Сдал' : '⏳ Ожидается') + '</td></tr>';
});
html += '<tr class="totals-row"><td colspan="2"><strong>ИТОГО:</strong> сдали ' + cPc + ' из ' + cTc + '</td><td class="amount"><strong>' + formatMoney(cInc) + ' ₽</strong></td><td></td></tr>';
html += '</tbody></table>';
}

const paidList = currentM.students.filter(s => s.name && s.paid);
const unpaidList = currentM.students.filter(s => s.name && !s.paid);

if (reportData.showPaid && paidList.length > 0) {
html += '<div style="margin-top:20px"><h3 style="color:#28a745;margin-bottom:10px;font-size:1.05em">✅ Уже сдали (' + paidList.length + ')</h3><div class="paid-list">';
paidList.forEach(s => { html += '<div class="list-item">✔ ' + escapeHtml(s.name) + (s.amount ? ' — ' + formatMoney(s.amount) + ' ₽' : '') + '</div>'; });
html += '</div></div>';
}

if (reportData.showUnpaid && unpaidList.length > 0) {
html += '<div style="margin-top:15px"><h3 style="color:#fd7e14;margin-bottom:10px;font-size:1.05em">⏳ Ещё не сдали (' + unpaidList.length + ')</h3><div class="unpaid-list">';
unpaidList.forEach(s => { html += '<div class="list-item"> ' + escapeHtml(s.name) + (s.amount ? ' — ' + formatMoney(s.amount) + ' ₽' : '') + '</div>'; });
html += '</div></div>';
}

html += '</div>';
}

html += '</div>';
html += '<div class="footer">';
html += '<p><strong>Родительский комитет</strong> · Группа №' + escapeHtml(g.number || '') + ' «' + escapeHtml(g.name || '') + '»</p>';
html += '<p style="margin-top:8px">Сводка сформирована: ' + generatedDate + '</p>';
html += '<a href="index.html" class="login-btn">🔐 Войти в систему</a>';
html += '</div></div>';

document.getElementById('app').innerHTML = html;
}

async function init() {
const token = getQueryParam('token');
if (!token) {
showError('Нет токена', 'Ссылка неполная. Проверьте, что скопировали её полностью.');
return;
}
const loaded = await loadReport(token);
if (!loaded) return;
showPasswordModal();
}

init();
</script>
</body>
</html>
